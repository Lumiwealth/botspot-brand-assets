name: Approved brand assets
on: [push, pull_request]
permissions:
  contents: read
jobs:
  brand-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/*.test.mjs
      - run: node scripts/check-brand-assets.mjs
